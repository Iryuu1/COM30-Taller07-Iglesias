<div class="app-shell">

      <span class="brand-mark" aria-hidden="true">E</span>
      <span>Inventario <span class="brand-muted">de equipos</span></span>
    </a>

    <nav class="menu" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
        Inicio
      </a>
      <a routerLink="/equipos" routerLinkActive="activo">Equipos</a>
      <a routerLink="/equipos/nueva" routerLinkActive="activo">Nuevo equipo</a>
      <a routerLink="/estadisticas" routerLinkActive="activo">Estadísticas</a>
      <a routerLink="/parcial2" routerLinkActive="activo">Parcial 2</a>
    </nav>

    <span class="course-label">COM30 · Taller 08</span>

  <main class="main-content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span>Programación con Frameworks para Web</span>
    <span>Institución Universitaria de Barranquilla</span>
  </footer>
</div>
